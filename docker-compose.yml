version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: news-assistant-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news-assistant-net

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: news-assistant-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - news-assistant-net

  ai-engine:
    build:
      context: ./service-a-ai-engine
      dockerfile: Dockerfile
    container_name: news-assistant-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: news_embeddings
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - qdrant
    networks:
      - news-assistant-net

  core-api:
    build:
      context: ./service-b-core-api
      dockerfile: Dockerfile
    container_name: news-assistant-core-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/news_assistant
      AI_ENGINE_BASE_URL: http://ai-engine:8000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_started
    networks:
      - news-assistant-net

networks:
  news-assistant-net:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data:
